<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@noirmd/previewer — Editor Test</title>

  <link rel="stylesheet" href="../dist/editor.css">
  <link rel="stylesheet" href="../dist/vanilla.css">

  <style>
    :root {
      --color-background-primary: #0f172a;
      --color-background-secondary-solid: #1e293b;
      --color-text-primary: #e2e8f0;
      --color-text-secondary: #94a3b8;
      --color-border: #334155;
      --color-accent-primary: #0ea5e9;
      --color-accent-hover: #38bdf8;
    }
    [data-theme="light"] {
      --color-background-primary: #f8fafc;
      --color-background-secondary-solid: #e2e8f0;
      --color-text-primary: #0f172a;
      --color-text-secondary: #475569;
      --color-border: #cbd5e1;
      --color-accent-primary: #0284c7;
      --color-accent-hover: #0369a1;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #editor {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .test-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 14px 20px;
      background: color-mix(in srgb, var(--color-background-secondary-solid) 70%, transparent);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .test-brand { display: flex; align-items: center; gap: 12px; }
    .test-logo { font-size: 32px; color: var(--color-accent-primary); }
    .test-brand h1 { margin: 0; font-size: 17px; font-weight: 700; }
    .test-brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--color-text-secondary); }
    .test-brand code, .test-footer code, .test-help-table code {
      background: color-mix(in srgb, var(--color-accent-primary) 12%, transparent);
      color: var(--color-accent-primary);
      padding: 1px 6px;
      border-radius: 5px;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 12px;
    }
    .test-actions { display: flex; gap: 8px; }
    .test-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--color-background-secondary-solid) 60%, transparent);
      color: var(--color-text-primary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .test-btn:hover { border-color: var(--color-accent-primary); color: var(--color-accent-primary); }
    .test-btn .material-icons-round { font-size: 17px; }

    .test-main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .test-main .nr-editor { flex: 1; }

    .test-footer {
      padding: 10px 20px;
      font-size: 12px;
      color: var(--color-text-secondary);
      border-top: 1px solid var(--color-border);
      text-align: center;
    }

    .test-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--color-background-secondary-solid);
      border: 1px solid var(--color-accent-primary);
      color: var(--color-text-primary);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 50;
    }
    .test-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .test-help {
      position: fixed;
      top: 64px;
      right: 16px;
      width: 340px;
      max-height: calc(100vh - 90px);
      overflow: auto;
      background: var(--color-background-secondary-solid);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
      padding: 14px;
      z-index: 40;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .test-help[data-open="true"] { opacity: 1; transform: none; pointer-events: auto; }
    .test-help-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .test-help-close {
      margin-left: auto;
      border: none;
      background: none;
      color: var(--color-text-secondary);
      font-size: 18px;
      cursor: pointer;
    }
    .test-help-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .test-help-table td { padding: 5px 4px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
    .test-help-table td:last-child { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="./bundle.js"></script>
</body>
</html>
